<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operativos municipales</title>
</head>
<body>
    <h1>Operativos de esterilización y chipeo</h1>
    <section id="login">
    <h2>Iniciar sesión</h2>

    <input type="text" id="rut" placeholder="RUT">
    <input type="password" id="clave" placeholder="Contraseña">

    <button id="entrar">Entrar</button>
</section>

    <section id="consulta-operativos">
        <h2>Consultar operativos disponibles</h2>

        <label for="sedeId">Sede:</label>
        <input type="text" id="sedeId" placeholder="Ej: SV-01">

        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha">

        <button id="buscar">Buscar operativos</button>

        <h3>Resultados</h3>
        <pre id="resultados"></pre>
        <div>
    <button id="anterior">Anterior</button>
        <span id="paginaActual">Página 1</span>
    <button id="siguiente">Siguiente</button>
        </div>
    </section>
    <script>
        const NUCLEO = 'https://nucleo-tr.onrender.com';
        let token = sessionStorage.getItem('token');
        let pagina = 1;
        const limite = 5;
        document.getElementById('entrar').addEventListener('click', async () => {
        const rut = document.getElementById('rut').value;
        const clave = document.getElementById('clave').value;

    try {
    const respuesta = await fetch(NUCLEO + '/api/nucleo/sesiones', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ rut, clave })
    });

    const datos = await respuesta.json();

    if (!respuesta.ok) {
        alert(datos.error?.mensaje || 'No se pudo iniciar sesión');
        return;
    }

    token = datos.token;
    sessionStorage.setItem('token', token);

    alert('Inicio de sesión correcto');
} catch (error) {
    alert('No se pudo conectar con el núcleo');
}
});
    async function buscarOperativos() {
    document.getElementById('paginaActual').textContent = 'Página ' + pagina;
    const sedeId = document.getElementById('sedeId').value;
    const fecha = document.getElementById('fecha').value;

    const parametros = new URLSearchParams();
    parametros.set('page', pagina);
    parametros.set('limit', limite);

    if (sedeId) parametros.set('sedeId', sedeId);
    if (fecha) parametros.set('fecha', fecha);

    const ruta = '/api/operativos/operativos?' + parametros.toString();

    try {
        const respuesta = await fetch(ruta, {
            headers: {
                Authorization: 'Bearer ' + token
            }
        });

        const datos = await respuesta.json();
        if (respuesta.ok) {
    const totalPaginas = Math.max(1, Math.ceil(datos.total / limite));

    document.getElementById('siguiente').disabled =
        pagina >= totalPaginas;

    document.getElementById('anterior').disabled =
        pagina <= 1;
}

        document.getElementById('resultados').textContent =
            JSON.stringify(datos, null, 2);

    } catch (error) {
        document.getElementById('resultados').textContent =
            'No se pudo conectar con la API de operativos';
    }
}

document.getElementById('buscar').addEventListener('click', () => {
    pagina = 1;
    buscarOperativos();
});
document.getElementById('anterior').addEventListener('click', () => {
    if (pagina > 1) {
        pagina--;
        buscarOperativos();
    }
});

document.getElementById('siguiente').addEventListener('click', () => {
    pagina++;
    buscarOperativos();
});
</script>
</body>
</html>
